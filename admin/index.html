<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Atendimentos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <h1>Atendimentos</h1>
    <p class="subtitle">Área privada — acesso restrito.</p>

    <div id="formMessage" class="form-message"></div>

    <form id="loginForm">
      <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div>
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Entrar</button>
    </form>
  </div>
</div>

<script type="module">
  import { supabase } from './js/supabaseClient.js';

  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const messageEl = document.getElementById('formMessage');

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = `form-message visible ${type}`;
  }

  // Se já estiver logada, pula direto pro dashboard.
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'dashboard.html';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Entrando...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      showMessage('E-mail ou senha incorretos.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar';
      return;
    }

    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
