<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atendimentos | Atendimentos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="app-shell">
  <nav class="app-nav">
    <div class="logo">Atendimentos</div>
    <a href="dashboard.html" data-page="dashboard.html">Dashboard</a>
    <a href="pacientes.html" data-page="pacientes.html">Pacientes</a>
    <a href="atendimentos.html" data-page="atendimentos.html">Atendimentos</a>
    <a href="receber.html" data-page="receber.html">A Receber</a>
    <a href="despesas.html" data-page="despesas.html">Despesas</a>
    <div class="nav-logout">
      <a href="#" id="logoutBtn">Sair</a>
    </div>
  </nav>

  <main class="app-main">
    <div class="page-header">
      <h1>Atendimentos</h1>
    </div>

    <div class="card">
      <h2 class="section-title-small" id="formTitle">Lançar atendimento</h2>
      <div id="formMessage" class="form-message"></div>
      <form id="sessionForm">
        <input type="hidden" id="sessionId">
        <div class="form-grid">
          <div>
            <label for="patientSelect">Paciente *</label>
            <select id="patientSelect" required></select>
          </div>
          <div>
            <label for="sessionDate">Data *</label>
            <input type="date" id="sessionDate" required>
          </div>
          <div>
            <label for="sessionTime">Hora</label>
            <input type="time" id="sessionTime">
          </div>
          <div>
            <label for="paymentMethodSelect">Tipo de cobrança *</label>
            <select id="paymentMethodSelect" required></select>
          </div>
          <div>
            <label for="value">Valor (R$)</label>
            <input type="number" id="value" step="0.01" min="0" placeholder="220,00">
          </div>
          <div>
            <label for="status">Status *</label>
            <select id="status" required>
              <option value="pendente">Pendente</option>
              <option value="pago">Pago</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Lançar atendimento</button>
          <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;">Cancelar edição</button>
        </div>
      </form>
    </div>

    <div class="filters-row">
      <input type="text" id="searchInput" placeholder="Buscar por paciente...">
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Hora</th>
            <th>Paciente</th>
            <th>Tipo</th>
            <th>Valor</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="sessionsTbody">
          <tr><td colspan="7" class="empty-state">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script type="module" src="js/atendimentos.js"></script>
</body>
</html>
