<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Atendimentos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="app-shell">
  <nav class="app-nav">
    <div class="logo">Atendimentos</div>
    <a href="dashboard.html" data-page="dashboard.html">Dashboard</a>
    <a href="pacientes.html" data-page="pacientes.html">Pacientes</a>
    <a href="atendimentos.html" data-page="atendimentos.html">Atendimentos</a>
    <a href="receber.html" data-page="receber.html">A Receber</a>
    <a href="despesas.html" data-page="despesas.html">Despesas</a>
    <div class="nav-logout">
      <a href="#" id="logoutBtn">Sair</a>
    </div>
  </nav>

  <main class="app-main">
    <div class="page-header">
      <h1>Dashboard</h1>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Nº de atendimentos</div>
        <div class="stat-value" id="statCount">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Média por atendimento</div>
        <div class="stat-value" id="statAvg">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total recebido</div>
        <div class="stat-value" id="statReceived">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total pendente</div>
        <div class="stat-value" id="statPending">—</div>
      </div>
    </div>

    <div class="card">
      <h2 class="section-title-small">Totais por tipo de cobrança</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Tipo</th><th>Atendimentos</th><th>Total</th></tr>
          </thead>
          <tbody id="methodBreakdownTbody">
            <tr><td colspan="3" class="empty-state">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2 class="section-title-small">Resumo mensal</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Mês</th><th>Atendimentos</th><th>Faturamento</th><th>Despesas</th><th>Lucro</th></tr>
          </thead>
          <tbody id="monthlyTbody">
            <tr><td colspan="5" class="empty-state">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
