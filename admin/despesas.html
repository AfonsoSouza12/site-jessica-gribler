<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Despesas | Atendimentos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="app-shell">
  <nav class="app-nav">
    <div class="logo">Atendimentos</div>
    <a href="dashboard.html" data-page="dashboard.html">Dashboard</a>
    <a href="pacientes.html" data-page="pacientes.html">Pacientes</a>
    <a href="atendimentos.html" data-page="atendimentos.html">Atendimentos</a>
    <a href="receber.html" data-page="receber.html">A Receber</a>
    <a href="despesas.html" data-page="despesas.html">Despesas</a>
    <div class="nav-logout">
      <a href="#" id="logoutBtn">Sair</a>
    </div>
  </nav>

  <main class="app-main">
    <div class="page-header">
      <h1>Despesas</h1>
    </div>

    <div class="card">
      <h2 class="section-title-small" id="formTitle">Cadastrar despesa</h2>
      <div id="formMessage" class="form-message"></div>
      <form id="expenseForm">
        <input type="hidden" id="expenseId">
        <div class="form-grid">
          <div>
            <label for="expenseType">Tipo *</label>
            <input type="text" id="expenseType" placeholder="Aluguel, Internet, Contador..." required>
          </div>
          <div>
            <label for="expenseValue">Valor (R$) *</label>
            <input type="number" id="expenseValue" step="0.01" min="0" required>
          </div>
          <div>
            <label for="expenseDate">Data *</label>
            <input type="date" id="expenseDate" required>
          </div>
          <div>
            <label for="expenseNote">Observação</label>
            <input type="text" id="expenseNote">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Cadastrar</button>
          <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;">Cancelar edição</button>
        </div>
      </form>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total de despesas</div>
        <div class="stat-value" id="expensesTotal">—</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Tipo</th>
            <th>Valor</th>
            <th>Observação</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="expensesTbody">
          <tr><td colspan="5" class="empty-state">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script type="module" src="js/despesas.js"></script>
</body>
</html>
