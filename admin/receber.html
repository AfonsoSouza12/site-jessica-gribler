<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Receber | Atendimentos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="app-shell">
  <nav class="app-nav">
    <div class="logo">Atendimentos</div>
    <a href="dashboard.html" data-page="dashboard.html">Dashboard</a>
    <a href="pacientes.html" data-page="pacientes.html">Pacientes</a>
    <a href="atendimentos.html" data-page="atendimentos.html">Atendimentos</a>
    <a href="receber.html" data-page="receber.html">A Receber</a>
    <a href="despesas.html" data-page="despesas.html">Despesas</a>
    <div class="nav-logout">
      <a href="#" id="logoutBtn">Sair</a>
    </div>
  </nav>

  <main class="app-main">
    <div class="page-header">
      <h1>Valores a Receber</h1>
    </div>

    <div class="filters-row">
      <select id="patientFilter">
        <option value="">Todos os pacientes</option>
      </select>
      <select id="methodFilter">
        <option value="">Todos os tipos de cobrança</option>
      </select>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Sessões pendentes</div>
        <div class="stat-value" id="pendingCount">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total a receber</div>
        <div class="stat-value" id="pendingTotal">—</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Paciente</th>
            <th>Tipo</th>
            <th>Valor</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="pendingTbody">
          <tr><td colspan="5" class="empty-state">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script type="module" src="js/receber.js"></script>
</body>
</html>
