    <path d="M0,0 C-30,-24 -34,-62 0,-92 C34,-62 30,-24 0,0 Z" transform="rotate(135) scale(2.35)"/>
    <path d="M0,0 C-30,-24 -34,-62 0,-92 C34,-62 30,-24 0,0 Z" transform="rotate(180) scale(2.35)"/>
    <path d="M0,0 C-30,-24 -34,-62 0,-92 C34,-62 30,-24 0,0 Z" transform="rotate(225) scale(2.35)"/>
    <path d="M0,0 C-30,-24 -34,-62 0,-92 C34,-62 30,-24 0,0 Z" transform="rotate(270) scale(2.35)"/>
    <path d="M0,0 C-30,-24 -34,-62 0,-92 C34,-62 30,-24 0,0 Z" transform="rotate(315) scale(2.35)"/>
