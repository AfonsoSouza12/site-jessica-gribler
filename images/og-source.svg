  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="230" r="330" fill="url(#glow)"/>

  <g transform="translate(955,300)" fill="#7c06b8" fill-opacity="0.22" stroke="#b478d9" stroke-width="1.8">
    <path d="M0,0 C-30,-24 -34,-62 0,-92 C34,-62 30,-24 0,0 Z" transform="rotate(0) scale(2.35)"/>
